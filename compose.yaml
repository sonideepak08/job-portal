services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: job_portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "job_portal"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: job_portal
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD_URLENCODED}@postgres:5432/job_portal
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION}
      S3_RESUME_BUCKET: ${S3_RESUME_BUCKET}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL}
      AWS_PROFILE: job-portal-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - "${USERPROFILE}/.aws:/root/.aws:ro"
  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD_URLENCODED}@postgres:5432/job_portal
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    command: ["npm", "run", "worker"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      AWS_REGION: ${AWS_REGION}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL}
      AWS_PROFILE: job-portal-dev
    volumes:
      - "${USERPROFILE}/.aws:/root/.aws:ro"
volumes:
  postgres_data:
  redis_data: